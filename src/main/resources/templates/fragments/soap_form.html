<div class="w3-container" th:fragment="soap_form">
    <form class="w3-form w3-center" action="#" th:action="@{/soap/mnb_request}" th:object="${param}" method="post">
        <table class="w3-content" style="max-width:800px; min-width:400px;">
            <tr class="w3-large">
                <td class="w3-right-align w3-bold w3-padding-small">Pénznem:</td>
                <td class="w3-left-align w3-padding-small">
                    <select id="currencySelector" class="w3-select w3-border" name="currencies" th:field="*{currency}"></select>
                </td>
            </tr>
            <tr class="w3-large">
                <td class="w3-right-align w3-bold w3-padding-small">Kezdő dátum: </td>
                <td class="w3-left-align w3-padding-small"><input class="w3-input w3-border" type="date" id="startDate" th:field="*{startDate}"></td>
            </tr>
            <tr class="w3-large">
                <td class="w3-right-align w3-bold w3-padding-small">Végső dátum: </td>
                <td class="w3-left-align w3-padding-small"><input class="w3-input w3-border" type="date" id="endDate" th:field="*{endDate}"></td>
            </tr>
        </table>
        <input type="submit" value="Lekérdez" class="w3-large w3-button w3-crimson w3-hover-green w3-round-large">
    </form>
</div>
<script th:inline="javascript">
    // console.log([[${defaultStartDate}]])
    // console.log([[${defaultEndDate}]])
    document.getElementById("startDate").value = [[${defaultStartDate}]];
    document.getElementById("endDate").value = [[${defaultEndDate}]];

    let currencies = [[${availableCurrencies}]]
    let currencySelect = document.getElementById("currencySelector")

    console.log(currencies)

    currencies.forEach(currency => {
        let instrOption = new Option(currency,currency)
        currencySelect.appendChild(instrOption)
    });


</script>
