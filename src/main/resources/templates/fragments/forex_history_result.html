<div class="w3-center w3-padding-32">
    <table class="w3-table-all" id="candleTable" style="overflow-x:visible; overflow-y:visible;">
        <tr class="w3-red">
            <td>Dátum</td>
            <td>Nyitás</td>
            <td>Zárás</td>
            <td>Magas</td>
            <td>Alacsony</td>
        </tr>
    </table>

    <a th:href="@{'/forex_history'}"><h2 class="w3-button w3-red w3-hover-green w3-round-large" style="margin-top: 60px">Vissza az űrlapra</h2></a>
</div>

<script th:inline="javascript">
    let table = document.getElementById("candleTable");
    let candlesticks = [[${candlesticks}]];

    console.log(candlesticks);

    candlesticks.forEach(candlestick => {
        let newRow = document.createElement("tr");
        // newRow.classList.add("w3-hoverable", "w3-striped", "w3-bold", "w3-centered");
        for (let j = 0; j < 5; j++) {
            let newCell = document.createElement("td");
            if ( j === 0 ) {
                newCell.innerText = candlestick.time;
                newRow.appendChild(newCell);
                table.appendChild(newRow);
                continue;
            }
            switch (j) {
                case 1:
                    newCell.innerText = candlestick.mid.o;
                    break;
                case 2:
                    newCell.innerText = candlestick.mid.c;
                    break;
                case 3:
                    newCell.innerText = candlestick.mid.h;
                    break;
                case 4:
                    newCell.innerText = candlestick.mid.l;
                    break;
                default:
                    newCell.innerText = "ERROR";
            }
            newRow.appendChild(newCell);
            table.appendChild(newRow);
        }
    })
    table.classList.add("w3-card"); //("w3-table-all");
</script>
