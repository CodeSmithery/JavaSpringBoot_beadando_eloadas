<div class="w3-container w3-large w3-padding-large w3-center" th:fragment="soap_result">
    <!--    <h1>Lekért árak:</h1>-->
    <!--    <p th:text="'Prices: ' + ${sendOut}"></p>-->
    <canvas id="myChart"></canvas>

    <script th:inline="javascript">
        let currency = [[${currency}]]
        let rates = [[${outObject}]];
        console.log(rates);
        let labelArray = [];
        let valueArray = [];

        console.log(rates);
        console.log(Array.isArray(rates));

        rates.days.forEach(day => {
            labelArray.unshift(day.date);
            valueArray.unshift(parseFloat(day.rate.value.replace(",",".")));
        })

        // valueArray.forEach(value => {
        //     console.log(value);
        // })
        const ctx = document.getElementById('myChart');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labelArray,
                datasets: [{
                    label: `Árfolyam (HUF / ${currency})`,
                    data: valueArray,
                }]
            }
        });
    </script>
    <a th:href="@{'/soap'}"><h2 class="w3-bold w3-button w3-crimson w3-padding-large w3-hover-green" style="margin-top: 120px">Vissza az űrlapra</h2></a>
</div>
