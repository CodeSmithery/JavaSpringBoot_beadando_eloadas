<div class="w3-container">
    <form class="w3-form w3-center" action="#" th:action="@{/forex_close/closed}" th:object="${position}" method="post">
        <table class="w3-content" style="max-width:800px; min-width:400px;">
            <tr class="w3-large">
                <td class="w3-right-align w3-bold w3-padding-small">Válassz egy devizapárt: </td>
                <td class="w3-left-align w3-padding-small"><select class="w3-select w3-border" id="tradeSelector" th:field="*{tradeId}"></select></td>
            </tr>
        </table>
        <input type="submit" value="POZÍCIÓ ZÁRÁSA" class="w3-large w3-button w3-crimson w3-hover-green w3-round-large">
    </form>
</div>
<script th:inline="javascript">
    let trades = [[${trades}]]
    let tradeSelect = document.getElementById("tradeSelector")
    // let quantityInput = document.getElementById("quantityInput")

    trades.forEach(trade => {
        let instrOption = new Option(trade.id,trade.id)
        tradeSelect.appendChild(instrOption)
    });

    //     catch(e){ console.log(e) }
    // }

</script>
