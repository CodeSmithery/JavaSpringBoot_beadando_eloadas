<!DOCTYPE html>
<html lang="en">
<head>
    <title>Java_Alk_E_bead</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        body,h1,h2,h3,h4,h5,h6 {font-family:"Lato",sans-serif}
        .w3-bar,h1,button {font-family:"Montserrat",sans-serif}
        .fa-anchor,.fa-coffee {font-size:200px}
    </style>
</head>

<body class="w3-dark-mode">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<header th:fragment="header" class="w3-container w3-crimson w3-center w3-padding-32">
    <h1 class="w3-margin w3-jumbo">FŐOLDAL</h1>
    <div class="w3-center">
        <button id="introButton" onclick="selectIntro()" class="w3-button w3-white w3-large w3-margin-top">
            Alkalmazás bemutató
        </button>

        <button id="sitesButton" onclick="selectSites()" class="w3-button w3-black w3-large w3-margin-top">
            Oldalak és tartalmuk
        </button>
    </div>
</header>

<!-- First Section -->
<div class="w3-container w3-center">
    <div id="introDiv" style="display: block" th:insert="~{fragments/index_introduction :: intro}"></div>
    <div id="sitesDiv" style="display:none" th:insert="~{fragments/index_sites :: sites}"></div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const mobileMenu = document.getElementById("navDemo");

    function myFunction() {
        mobileMenu.classList.toggle("w3-show");
    }

    function initialSelection() {

    }

    let introDiv = document.getElementById("introDiv");
    let sitesDiv = document.getElementById("sitesDiv");
    let introButton = document.getElementById("introButton");
    let sitesButton = document.getElementById("sitesButton");

    function selectIntro() {
        introButton.classList.add("w3-white");
        introButton.classList.remove("w3-black");

        sitesButton.classList.add("w3-black");
        sitesButton.classList.remove("w3-white");

        introDiv.style.display = "block";
        sitesDiv.style.display = "none";
    }
    function selectSites() {
        sitesButton.classList.add("w3-white");
        sitesButton.classList.remove("w3-black");

        introButton.classList.add("w3-black");
        introButton.classList.remove("w3-white");

        sitesDiv.style.display = "block";
        introDiv.style.display = "none";
    }


</script>

</body>
</html>
