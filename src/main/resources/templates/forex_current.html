<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forex-AktÁr </title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body,h1,h2,h3,h4,h5,h6 {font-family:"Lato",sans-serif}
        .w3-bar,h1,button {font-family:"Montserrat",sans-serif}
        .fa-anchor,.fa-coffee {font-size:200px}
    </style>
</head>


<body class="w3-dark-mode">
<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="w3-padding-64">
    <div class="w3-container w3-center">
        <select class="w3-center w3-select w3-border" style="max-width: 400px" id="instrumentSelector" onchange="selectedInstrument(this.value)">
            <option value="" disabled selected>Válassz egyet a listából!</option>
        </select>
        <table class="w3-content">
            <tr class="w3-center">
                <td class="w3-italic w3-large">Aktuális ár:</td>
                <td class="w3-bold w3-large" id="value"></td>
            </tr>
        </table>
    </div>


</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">
    const mobileMenu = document.getElementById("navDemo");

    function myFunction() {
        mobileMenu.classList.toggle("w3-show");
    }
    let instruments = [[${instruments}]]
    let prices = [[${prices}]]
    let select = document.getElementById("instrumentSelector")
    let value = document.getElementById("value")

    // console.log(instruments)
    // console.log(prices)

    instruments.forEach(instrument => {
        let option = new Option(instrument.displayName,instrument.name)
        select.appendChild(option)
    })
    function selectedInstrument(selectedInstrument) {
        const index = prices.findIndex(price => price.instrument === selectedInstrument)
        // console.log(prices[index].closeoutAsk)
        value.innerHTML = prices[index].closeoutAsk
    }

</script>
</body>
</html>
